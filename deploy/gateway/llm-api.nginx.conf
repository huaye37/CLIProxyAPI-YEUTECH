# LAN-only DNS maps this host to the NAS; the public DNS still points to Hong Kong.
map $http_upgrade $yeutech_inference_connection {
    default upgrade;
    '' '';
}
server {
    listen 80;
    listen [::]:80;
    server_name llm-api.yeutech.cn;
    return 308 https://llm-api.yeutech.cn$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm-api.yeutech.cn;
    ssl_certificate /volume1/docker/yeutech-portal-local/certs/fullchain.pem;
    ssl_certificate_key /volume1/docker/yeutech-portal-local/certs/privkey.pem;
    include conf.d/ssl.*.conf;
    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, noarchive" always;
    location ~ ^/v1/(models|model-capabilities|responses(/compact)?|alpha/search|chat/completions|messages(/count_tokens)?)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $yeutech_inference_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ignore_client_abort off;
        proxy_next_upstream off;
        # These are inactivity limits, not an absolute model execution deadline.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_pass http://127.0.0.1:18312;
    }
    location / { return 404; }
}
